<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            margin-bottom: 25px;
            font-size: 22px;
            text-align: center;
        }
        .drama-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-sizing: border-box;
        }
        .drama-img {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .drama-title {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0 5px 0;
        }
        .drama-price {
            color: #4cd137;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn-buy {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-buy:hover {
            background-color: #1d69a8;
        }
        .btn-buy:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>Escolha seu Minidrama</h1>

    <!-- DRAMA 2 -->
    <div class="drama-card">
        <img src="capa2.jpg" alt="Capa Drama 2" class="drama-img">
        <div class="drama-title">Princesa Renascida dos Três Cowboys</div>
        <div class="drama-price">R$ 5,00</div>
        <button class="btn-buy" onclick="comprarProduto(event, 'Princesa Renascida dos Três Cowboys', 5.00)">Gerar PIX</button>
    </div>

    <!-- DRAMA 1 -->
    <div class="drama-card">
        <img src="capa1.jpg" alt="Capa Drama 1" class="drama-img">
        <div class="drama-title">A Herdeira que Bloqueou o Marido</div>
        <div class="drama-price">R$ 5,00</div>
        <button class="btn-buy" onclick="comprarProduto(event, 'A Herdeira que Bloqueou o Marido', 5.00)">Gerar PIX</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const MAKE_WEBHOOK_URL = "https://hook.us2.make.com/ju7lnikxsisbl10wh0a2d8vvdx39y858";

        async function comprarProduto(event, nomeDrama, precoProduto) {
            const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : "teste_web";
            
            const botao = event.target;
            botao.innerText = "Gerando Pix...";
            botao.disabled = true;

            try {
                const resposta = await fetch(MAKE_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        drama: nomeDrama,
                        valor: precoProduto
                    })
                });

                if (resposta.ok) {
                    alert('Pix gerado com sucesso!');
                } else {
                    alert('Erro ao comunicar com o servidor.');
                }
            } catch (erro) {
                console.error('Erro:', erro);
                alert('Falha ao enviar dados.');
            } finally {
                botao.innerText = "Gerar PIX";
                botao.disabled = false;
            }
        }
    </script>
</body>
</html>
