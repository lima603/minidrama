<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Minidramas</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: #0f0f0f; 
            color: #fff; 
            margin: 0; 
            padding: 12px; 
        }
        h1 { 
            text-align: center; 
            font-size: 18px; 
            margin-bottom: 20px; 
            color: #ff3b30; 
            font-weight: bold;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            max-width: 500px; 
            margin: 0 auto; 
        }
        .card { 
            background-color: #1a1a1a; 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid #333; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img { 
            width: 100%; 
            height: 190px; 
            object-fit: cover; 
        }
        .card-content { 
            padding: 10px; 
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }
        .title { 
            font-size: 13px; 
            font-weight: bold; 
            margin-bottom: 8px; 
            line-height: 1.2;
        }
        .price { 
            font-size: 14px; 
            color: #4cd964; 
            margin-bottom: 10px; 
            font-weight: bold; 
        }
        .btn-buy { 
            background-color: #ff3b30; 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 6px; 
            width: 100%; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 13px; 
            text-transform: uppercase;
        }
        .btn-buy:active { 
            opacity: 0.8; 
        }
    </style>
</head>
<body>

    <h1>🎬 CATÁLOGO DE MINIDRAMAS</h1>

    <div id="catalogo" class="grid">
        <div class="card">
            <img src="capa1.jpg" alt="A Herdeira que Bloqueou o Marido">
            <div class="card-content">
                <div>
                    <div class="title">A Herdeira que Bloqueou o Marido</div>
                    <div class="price">R$ 5</div>
                </div>
                <button class="btn-buy" onclick="comprarProduto('A Herdeira que Bloqueou o Marido', 5.00)">Gerar PIX</button>
            </div>
        </div>

        <div class="card">
            <img src="capa2.jpg" alt="Princesa Renascida dos Três Cowboys">
            <div class="card-content">
                <div>
                    <div class="title">Princesa Renascida dos Três Cowboys</div>
                    <div class="price">R$ 5</div>
                </div>
                <button class="btn-buy" onclick="comprarProduto('Princesa Renascida dos Três Cowboys', 5.00)">Gerar PIX</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const MAKE_WEBHOOK_URL = "https://hook.us2.make.com/s1gpcuh93g4v5qqwhvg7w287c7om4uz";

        async function comprarProduto(nomeDrama, precoProduto) {
            const userId = tg.initDataUnsafe?.user?.id || "teste_web";[cite: 1]

            event.target.innerText = "Gerando Pix...";
            event.target.disabled = true;

            try {
                const resposta = await fetch(MAKE_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        drama: nomeDrama,
                        valor: precoProduto
                    })
                });

                if (resposta.ok) {
                    alert("Pix solicitado com sucesso! Volte ao Telegram para ver o QR Code.");
                } else {
                    alert("Houve um problema ao gerar o Pix. Tente novamente.");
                }
            } catch (erro) {
                console.error("Erro na requisição:", erro);[cite: 1]
                alert("Falha de conexão com o servidor.");
            } finally {
                event.target.innerText = "Gerar PIX";
                event.target.disabled = false;
            }
        }
    </script>
</body>
</html>
