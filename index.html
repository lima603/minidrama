<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
        }
        .dramas-container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            width: 100%;
            max-width: 100%;
            justify-content: center;
        }
        .drama-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 10px;
            width: 48%;
            max-width: 160px;
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .drama-img {
            width: 100%;
            height: 130px;
            border-radius: 6px;
            object-fit: cover;
            margin-bottom: 8px;
        }
        .drama-title {
            font-size: 13px;
            font-weight: bold;
            margin: 5px 0;
            line-height: 1.2;
            height: 32px;
            overflow: hidden;
        }
        .drama-price {
            color: #4cd137;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .btn-buy {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-buy:hover {
            background-color: #1d69a8;
        }
        .btn-buy:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>Escolha seu Minidrama</h1>

    <div class="dramas-container">
        <!-- DRAMA 1 -->
        <div class="drama-card">
            <div>
                <img src="capa2.jpg" alt="Capa Drama 1" class="drama-img">
                <div class="drama-title">Princesa Renascida dos Três Cowboys</div>
            </div>
            <div>
                <div class="drama-price">R$ 5,00</div>
                <button class="btn-buy" onclick="comprarProduto(event, 'Princesa Renascida dos Três Cowboys', 5.00)">Gerar PIX</button>
            </div>
        </div>

        <!-- DRAMA 2 -->
        <div class="drama-card">
            <div>
                <img src="capa1.jpg" alt="Capa Drama 2" class="drama-img">
                <div class="drama-title">A Herdeira que Bloqueou o Marido</div>
            </div>
            <div>
                <div class="drama-price">R$ 5,00</div>
                <button class="btn-buy" onclick="comprarProduto(event, 'A Herdeira que Bloqueou o Marido', 5.00)">Gerar PIX</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const MAKE_WEBHOOK_URL = "https://hook.us2.make.com/s43owf5is3s5a9cfxaxpo7qw83o1f0rf";

       async function comprarProduto(event, nomeDrama, precoProduto) {
            const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : "teste_web";
            
            const botao = event.target;
            botao.innerText = "Gerando Pix...";
            botao.disabled = true;

            try {
                const resposta = await fetch(MAKE_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        drama: nomeDrama,
                        valor: precoProduto
                    })
                });

                if (resposta.ok) {
                    botao.innerText = "Pix Gerado! Redirecionando...";
                    
                    // Tenta fechar o Mini App de todas as formas possíveis no Telegram
                    setTimeout(() => {
                        if (window.Telegram && window.Telegram.WebApp) {
                            window.Telegram.WebApp.close();
                        } else if (typeof tg !== 'undefined' && tg.close) {
                            tg.close();
                        }
                    }, 1000); // Espera 1 segundo para o usuário ler que deu certo e fecha
                } else {
                    alert('Erro ao gerar o Pix. Tente novamente.');
                    botao.innerText = "Gerar PIX";
                    botao.disabled = false;
                }
            } catch (erro) {
                console.error('Erro:', erro);
                alert('Falha de conexão.');
                botao.innerText = "Gerar PIX";
                botao.disabled = false;
            }
        }
